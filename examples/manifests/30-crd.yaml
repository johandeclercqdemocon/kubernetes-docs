# ch 30. A CRD with a real schema, a status subresource and printer columns.
# No controller — this shows what the API server gives you for free.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: pingdservices.example.com}
spec:
  group: example.com
  names:
    kind: PingdService
    plural: pingdservices
    singular: pingdservice
    shortNames: ["pds"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["replicas"]
              properties:
                replicas: {type: integer, minimum: 1, maximum: 100,
                           description: "How many pingd replicas to run."}
                version: {type: string, description: "Application version."}
            status:
              type: object
              properties:
                readyReplicas: {type: integer}
      additionalPrinterColumns:
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Version, type: string, jsonPath: .spec.version}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
