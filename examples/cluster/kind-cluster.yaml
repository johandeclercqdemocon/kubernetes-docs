# The cluster this book is measured against: one control plane, two workers,
# with the ingress-ready wiring so Chapter 13's examples work.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8sbook
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8180
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
